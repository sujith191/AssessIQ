
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssessIQ - Student Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            color: #222;
        }

        header {
            background: #243b80;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .panel {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        button {
            background: #243b80;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            margin: 5px 4px 5px 0;
        }

        button:hover {
            background: #18295c;
        }

        .logout {
            background: #c62828;
        }

        input[type="text"] {
            padding: 10px;
            width: 100%;
            max-width: 350px;
            margin: 8px 0;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        .assessment {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            margin: 12px 0;
        }

        .question {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .question label {
            display: block;
            margin: 8px 0;
        }

        #message {
            white-space: pre-wrap;
            margin: 12px 0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <div>
        <h1>AssessIQ</h1>
        <p>Student Dashboard</p>
        <span>Logged in as: <strong id="loggedInUsername">Loading...</strong></span>
    </div>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<main>
    <section class="panel">
        <h2>Available Assessments</h2>
        <button onclick="loadAssessments()">Refresh Assessments</button>
        <div id="assessmentList">Loading assessments...</div>
    </section>

    <section class="panel hidden" id="quizPanel">
        <h2 id="quizTitle">Assessment</h2>
        <p id="quizDescription"></p>

        <form id="quizForm">
            <label for="studentName">Your name</label><br>
            <input type="text" id="studentName" readonly><br>
            <div id="questionsContainer"></div>
            <button type="submit">Submit Assessment</button>
            <button type="button" onclick="closeQuiz()">Cancel</button>
        </form>

        <div id="quizResult"></div>
    </section>

    <div id="message"></div>
</main>

<script>
    let currentAssessmentId = null;
    let currentQuestions = [];

    async function checkLogin() {
        const response = await fetch('/api/auth/me');

        if (response.status === 401) {
            window.location.replace('/auth.html');
            return false;
        }

        if (!response.ok) {
            document.getElementById('message').textContent =
                'Could not verify your login. Please refresh the page.';
            return false;
        }

        const user = await response.json();

        document.getElementById('loggedInUsername').textContent =
            user.username;

        document.getElementById('studentName').value =
            user.username;

        return true;
    }

    async function logout() {
        try {
            const response = await fetch('/api/auth/logout', {
                method: 'POST'
            });

            if (response.ok) {
                window.location.replace('/auth.html');
            } else {
                alert('Logout failed. Please try again.');
            }
        } catch (error) {
            alert('Unable to contact the server.');
        }
    }

    async function loadAssessments() {
        try {
            const response = await fetch('/api/assessments');

            if (!response.ok) {
                throw new Error('Failed to load assessments');
            }

            const assessments = await response.json();
            const list = document.getElementById('assessmentList');
            list.innerHTML = '';

            if (!assessments.length) {
                list.textContent = 'No assessments available yet.';
                return;
            }

            assessments.forEach(assessment => {
                const card = document.createElement('div');
                card.className = 'assessment';

                const title = document.createElement('h3');
                title.textContent = assessment.title || 'Untitled Assessment';

                const description = document.createElement('p');
                description.textContent =
                    assessment.description || 'No description available.';

                const button = document.createElement('button');
                button.textContent = 'Take Assessment';
                button.addEventListener('click', () => {
                    openAssessment(assessment.id);
                });

                card.append(title, description, button);
                list.appendChild(card);
            });
        } catch (error) {
            document.getElementById('assessmentList').textContent =
                'Unable to load assessments. Please refresh the page.';
            console.error(error);
        }
    }

    async function openAssessment(id) {
        try {
            const response = await fetch(
                '/api/assessments/' + encodeURIComponent(id) + '/questions'
            );

            if (!response.ok) {
                throw new Error('Could not load questions');
            }

            const questions = await response.json();

            currentAssessmentId = id;
            currentQuestions = questions;

            const assessmentsResponse = await fetch('/api/assessments');
            const assessments = await assessmentsResponse.json();

            const assessment = assessments.find(item => item.id === id);

            document.getElementById('quizTitle').textContent =
                assessment ? assessment.title : 'Assessment';

            document.getElementById('quizDescription').textContent =
                assessment ? assessment.description || '' : '';

            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            if (!questions.length) {
                container.textContent = 'This assessment has no questions yet.';
            }

            questions.forEach((question, index) => {
                const section = document.createElement('div');
                section.className = 'question';

                const heading = document.createElement('p');
                heading.textContent =
                    (index + 1) + '. ' + question.text;
                section.appendChild(heading);

                ['A', 'B', 'C', 'D'].forEach(option => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');

                    radio.type = 'radio';
                    radio.name = 'question-' + question.id;
                    radio.value = option;
                    radio.required = true;

                    label.append(
                        radio,
                        document.createTextNode(
                            ' ' + option + '. ' +
                            (question['option' + option] || '')
                        )
                    );

                    section.appendChild(label);
                });

                container.appendChild(section);
            });

            document.getElementById('quizResult').textContent = '';
            document.getElementById('quizPanel').classList.remove('hidden');
            document.getElementById('quizPanel').scrollIntoView({
                behavior: 'smooth'
            });
        } catch (error) {
            alert('Unable to open this assessment. Please try again.');
            console.error(error);
        }
    }

    function closeQuiz() {
        document.getElementById('quizPanel').classList.add('hidden');
        document.getElementById('quizForm').reset();
        document.getElementById('quizResult').textContent = '';
        currentAssessmentId = null;
        currentQuestions = [];
    }

    document.getElementById('quizForm').addEventListener('submit',
        async function(event) {
            event.preventDefault();

            if (currentAssessmentId === null) {
                return;
            }

            const answers = currentQuestions.map(question => {
                const selected = document.querySelector(
                    'input[name="question-' + question.id + '"]:checked'
                );

                return {
                    questionId: question.id,
                    selectedAnswer: selected ? selected.value : ''
                };
            });

            try {
                const response = await fetch(
                    '/api/assessments/' +
                    encodeURIComponent(currentAssessmentId) + '/submit',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
body: JSON.stringify(answers)
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    document.getElementById('quizResult').textContent =
                        typeof result === 'string'
                            ? result
                            : 'Assessment submission failed.';
                    return;
                }

                document.getElementById('quizResult').textContent =
                    'Assessment submitted!\n' +
                    'Score: ' + result.score + ' / ' +
                    result.totalQuestions + '\n' +
                    'Percentage: ' + result.percentage + '%';

                document.getElementById('quizResult').scrollIntoView({
                    behavior: 'smooth'
                });
            } catch (error) {
                document.getElementById('quizResult').textContent =
                    'Could not submit the assessment. Please try again.';
                console.error(error);
            }
        }
    );

    async function initializeDashboard() {
        try {
            const loggedIn = await checkLogin();

            if (loggedIn) {
                await loadAssessments();
            }
        } catch (error) {
            console.error('Dashboard initialization failed:', error);
            document.getElementById('message').textContent =
                'Could not connect to the server. Please refresh the page.';
        }
    }

    initializeDashboard();
</script>

</body>
</html>
