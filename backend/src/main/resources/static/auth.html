
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssessIQ - Student Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px #00000012;
        }

        h1, h2 {
            text-align: center;
            color: #243b80;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tabs button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background: #e2e8f0;
            color: #1e293b;
        }

        .tabs button.active {
            background: #3457d5;
            color: white;
        }

        label {
            display: block;
            margin: 13px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        .submit {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #3457d5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            margin-top: 15px;
            overflow-wrap: anywhere;
            text-align: center;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #b91c1c;
        }

        .hidden {
            display: none;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3457d5;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>AssessIQ</h1>
    <p class="subtitle">Your online assessment platform</p>

    <div class="tabs">
        <button type="button" id="loginTab" class="active">
            Student Login
        </button>
        <button type="button" id="registerTab">
            Register
        </button>
    </div>

    <form id="loginForm">
        <h2>Welcome Back</h2>

        <label for="loginUsername">Username</label>
        <input
            id="loginUsername"
            name="username"
            autocomplete="username"
            required
        >

        <label for="loginPassword">Password</label>
        <input
            id="loginPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button class="submit" type="submit">Login</button>
    </form>

    <form id="registerForm" class="hidden">
        <h2>Create Account</h2>

        <label for="registerUsername">Username</label>
        <input
            id="registerUsername"
            name="username"
            autocomplete="username"
            minlength="3"
            required
        >

        <label for="registerEmail">Email</label>
        <input
            id="registerEmail"
            name="email"
            type="email"
            autocomplete="email"
            required
        >

        <label for="registerPassword">Password</label>
        <input
            id="registerPassword"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button class="submit" type="submit">Create Account</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <a class="home" href="/">Back to Home</a>
</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const message = document.getElementById("message");

    function showMessage(text, type = "") {
        message.textContent = text;
        message.className = "message " + type;
    }

    async function readResponse(response) {
        const text = await response.text();

        if (!text) {
            return {};
        }

        try {
            return JSON.parse(text);
        } catch {
            return { message: text };
        }
    }

    function showLogin() {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");
        loginTab.classList.add("active");
        registerTab.classList.remove("active");
        showMessage("");
    }

    function showRegister() {
        registerForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
        registerTab.classList.add("active");
        loginTab.classList.remove("active");
        showMessage("");
    }

    loginTab.addEventListener("click", showLogin);
    registerTab.addEventListener("click", showRegister);

    registerForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const button = registerForm.querySelector(".submit");
        button.disabled = true;
        showMessage("Creating your account...");

        try {
            const response = await fetch("/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: document.getElementById("registerUsername").value.trim(),
                    email: document.getElementById("registerEmail").value.trim(),
                    password: document.getElementById("registerPassword").value
                })
            });

            const data = await readResponse(response);

            if (!response.ok) {
                throw new Error(
                    data.message || data.error || "Registration failed."
                );
            }

            const registeredUsername =
                data.username ||
                document.getElementById("registerUsername").value.trim();

            registerForm.reset();
            showLogin();

            document.getElementById("loginUsername").value =
                registeredUsername;

            showMessage(
                "Registration successful! Please log in.",
                "success"
            );
        } catch (error) {
            showMessage(
                error.message || "Unable to register. Check the server.",
                "error"
            );
        } finally {
            button.disabled = false;
        }
    });

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const button = loginForm.querySelector(".submit");
        button.disabled = true;
        showMessage("Logging in...");

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: document.getElementById("loginUsername").value.trim(),
                    password: document.getElementById("loginPassword").value
                })
            });

            const data = await readResponse(response);

            if (!response.ok) {
                throw new Error(
                    data.message || data.error || "Login failed."
                );
            }

            showMessage(
                "Login successful! Opening student dashboard...",
                "success"
            );

            window.location.href = "/student.html";
        } catch (error) {
            showMessage(
                error.message || "Unable to log in. Check the server.",
                "error"
            );
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
